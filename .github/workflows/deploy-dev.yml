name: Deploy to Development

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  notify-deployment:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger deployment webhook
        run: |
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: ${{ secrets.WEBHOOK_SIGNATURE }}" \
            -d '{"ref":"refs/heads/develop","repository":{"name":"${{ github.repository }}"},"pusher":{"name":"${{ github.actor }}"},"commits":[]}' \
            ${{ secrets.DEV_WEBHOOK_URL }}

  deploy-frontend-develop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - name: Build only (PR validation)
        if: github.event_name == 'pull_request'
        run: npx vite build --mode develop

      - name: Build and deploy
        if: github.event_name == 'push'
        run: pnpm run deploy:develop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-worker-develop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Dry-run deploy (PR validation)
        if: github.event_name == 'pull_request'
        run: npx wrangler deploy --dry-run --env develop

      - name: Deploy
        if: github.event_name == 'push'
        run: pnpm run deploy:develop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
